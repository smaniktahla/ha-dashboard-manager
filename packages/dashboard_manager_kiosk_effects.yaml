# =============================================================================
# dashboard_manager_kiosk_effects.yaml
# Per-kiosk screen/transition effects, edited from the Dashboard Manager UI.
#
# The helpers below show the settings of the kiosk picked in "Kiosk to manage".
# "Apply to kiosk" writes them to /config/www/kiosk_effects.json via
# dashboard_manager/kiosk_effects.py; each kiosk fetches that file
# (http://<ha>/local/kiosk_effects.json) and follows it live. The file, not the helper
# states, is the source of truth, so the settings survive restarts and a lost restore_state.
# Picking a kiosk (or an HA start) loads its saved values back into the helpers.
# =============================================================================

input_select:
  kiosk_effects_transition_mode:
    name: Dashboard transition
    options: [none, fade, crossfade]
    icon: mdi:transition

input_number:
  kiosk_effects_transition_seconds:
    name: Transition length
    min: 0
    max: 5
    step: 0.1
    unit_of_measurement: s
    mode: slider
    icon: mdi:timer-sand
  kiosk_effects_transition_hold:
    name: Transition hold (new dashboard renders)
    min: 0
    max: 5
    step: 0.1
    unit_of_measurement: s
    mode: slider
    icon: mdi:timer-sand-paused
  kiosk_effects_blank_fade:
    name: Screen-off fade
    min: 0
    max: 5
    step: 0.1
    unit_of_measurement: s
    mode: slider
    icon: mdi:monitor-off
  kiosk_effects_wake_delay:
    name: Wake offset (black while the monitor wakes)
    min: 0
    max: 6
    step: 0.1
    unit_of_measurement: s
    mode: slider
    icon: mdi:timer-outline
  kiosk_effects_wake_fade:
    name: Wake fade-in
    min: 0
    max: 5
    step: 0.1
    unit_of_measurement: s
    mode: slider
    icon: mdi:monitor-shimmer

shell_command:
  dashboard_manager_read_kiosk_effects: >-
    python3 /config/dashboard_manager/kiosk_effects.py read {{ kiosk }}
  dashboard_manager_write_kiosk_effects: >-
    python3 /config/dashboard_manager/kiosk_effects.py write {{ kiosk }} {{ payload }}

script:
  dashboard_manager_load_kiosk_effects:
    alias: "[Dashboard] Load effects of the selected kiosk"
    mode: restart
    sequence:
      - variables:
          kiosk: "{{ states('input_select.dashboard_manager_browser_picker') }}"
      - condition: template
        value_template: >-
          {{ kiosk in (state_attr('sensor.dashboard_manager_kiosk_choices', 'browsers') or []) }}
      - service: shell_command.dashboard_manager_read_kiosk_effects
        data:
          kiosk: "{{ kiosk }}"
        response_variable: result
      - condition: template
        value_template: "{{ result.returncode == 0 }}"
      - variables:
          v: "{{ result.stdout | from_json({}) }}"
      - service: input_select.select_option
        target:
          entity_id: input_select.kiosk_effects_transition_mode
        data:
          option: "{{ v.transition_mode | default('fade') }}"
      - repeat:
          for_each:
            - {entity: input_number.kiosk_effects_transition_seconds, key: transition_seconds, default: 0.6}
            - {entity: input_number.kiosk_effects_transition_hold, key: transition_hold, default: 0.5}
            - {entity: input_number.kiosk_effects_blank_fade, key: blank_fade, default: 1.5}
            - {entity: input_number.kiosk_effects_wake_delay, key: wake_delay, default: 1.4}
            - {entity: input_number.kiosk_effects_wake_fade, key: wake_fade, default: 1.0}
          sequence:
            - service: input_number.set_value
              target:
                entity_id: "{{ repeat.item.entity }}"
              data:
                value: "{{ v[repeat.item.key] | default(repeat.item.default) }}"

  dashboard_manager_apply_kiosk_effects:
    alias: "[Dashboard] Apply effects to the selected kiosk"
    mode: restart
    sequence:
      - variables:
          kiosk: "{{ states('input_select.dashboard_manager_browser_picker') }}"
      - condition: template
        value_template: >-
          {{ kiosk in (state_attr('sensor.dashboard_manager_kiosk_choices', 'browsers') or []) }}
      - service: shell_command.dashboard_manager_write_kiosk_effects
        data:
          kiosk: "{{ kiosk }}"
          payload: >-
            {{ ({
              'transition_mode': states('input_select.kiosk_effects_transition_mode'),
              'transition_seconds': states('input_number.kiosk_effects_transition_seconds') | float(0.6),
              'transition_hold': states('input_number.kiosk_effects_transition_hold') | float(0.5),
              'blank_fade': states('input_number.kiosk_effects_blank_fade') | float(1.5),
              'wake_delay': states('input_number.kiosk_effects_wake_delay') | float(1.4),
              'wake_fade': states('input_number.kiosk_effects_wake_fade') | float(1.0)
            } | tojson) | base64_encode }}
        response_variable: saved
      - service: persistent_notification.create
        data:
          notification_id: kiosk_effects_saved
          title: "Kiosk effects"
          message: >-
            {{ 'Saved for ' ~ kiosk ~ '. The kiosk picks it up within a few seconds.'
               if saved.returncode == 0 else 'Could not save: ' ~ saved.stderr }}

automation:
  - id: dashboard_manager_load_kiosk_effects_on_change
    alias: "[Dashboard] Load kiosk effects when the kiosk changes"
    mode: restart
    trigger:
      - platform: state
        entity_id: input_select.dashboard_manager_browser_picker
      - platform: homeassistant
        event: start
    action:
      - service: script.dashboard_manager_load_kiosk_effects
